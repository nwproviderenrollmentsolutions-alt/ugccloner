version: "3.9"

# Local Postgres for development. `docker compose up -d postgres`, then set
# DATABASE_URL="postgresql://ugc:ugc@localhost:5432/ugc_cloner" in .env (already the
# default in .env.example) and run `npm run db:push`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ugc
      POSTGRES_PASSWORD: ugc
      POSTGRES_DB: ugc_cloner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
